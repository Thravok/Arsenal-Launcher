name: Package for macOS
description: Create a macOS package for Arsenal Launcher

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: macOS
  apple-codesign-cert:
    description: Certificate for signing macOS builds
    required: false
  apple-codesign-password:
    description: Password for signing macOS builds
    required: false
  apple-codesign-id:
    description: Certificate ID for signing macOS builds
    required: false
  apple-notarize-apple-id:
    description: Apple ID used for notarizing macOS builds
    required: false
  apple-notarize-team-id:
    description: Team ID used for notarizing macOS builds
    required: false
  apple-notarize-password:
    description: Password used for notarizing macOS builds
    required: false
  sparkle-ed25519-key:
    description: Private key for signing Sparkle updates (Sparkle seed from generate_keys -x)
    required: false
  release-tag:
    description: Git tag for this build (e.g. v1.0.0). When set, generates appcast.xml for GitHub Releases.
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Fetch codesign certificate
      shell: bash
      run: |
        echo '${{ inputs.apple-codesign-cert }}' | base64 --decode > codesign.p12
        if [ -n '${{ inputs.apple-codesign-id }}' ]; then
          security create-keychain -p '${{ inputs.apple-codesign-password }}' build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p '${{ inputs.apple-codesign-password }}' build.keychain
          security import codesign.p12 -k build.keychain -P '${{ inputs.apple-codesign-password }}' -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k '${{ inputs.apple-codesign-password }}' build.keychain
        else
          echo ":warning: Using ad-hoc code signing for macOS, as certificate was not present." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Package
      shell: bash
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }}

        cd ${{ env.INSTALL_DIR }}
        chmod +x "Arsenal.app/Contents/MacOS/arsenal"

        if [ -n '${{ inputs.apple-codesign-id }}' ]; then
          APPLE_CODESIGN_ID='${{ inputs.apple-codesign-id }}'
          ENTITLEMENTS_FILE='../program_info/App.entitlements'
        else
          APPLE_CODESIGN_ID='-'
          ENTITLEMENTS_FILE='../program_info/AdhocSignedApp.entitlements'
        fi

        # Avoid --deep: jars under Contents/MacOS/jars are not Mach-O, and codesign --deep
        # fails with "code object is not signed at all" on NewLaunchLegacy.jar (and friends).
        # Sign the executable, then the app bundle so jars are sealed as resources.
        # Frameworks keep the signatures from macdeployqt / Sparkle; ad-hoc builds also use
        # disable-library-validation in AdhocSignedApp.entitlements.
        sudo codesign --sign "$APPLE_CODESIGN_ID" --force --entitlements "$ENTITLEMENTS_FILE" --options runtime \
          "Arsenal.app/Contents/MacOS/arsenal"
        sudo codesign --sign "$APPLE_CODESIGN_ID" --force --entitlements "$ENTITLEMENTS_FILE" --options runtime \
          "Arsenal.app"
        sudo codesign --verify --verbose=2 "Arsenal.app"
        mv "Arsenal.app" "Arsenal Launcher.app"

    - name: Notarize
      shell: bash
      env:
        INSTALL_DIR: install
      run: |
        cd ${{ env.INSTALL_DIR }}

        if [ -n '${{ inputs.apple-notarize-password }}' ]; then
          ditto -c -k --sequesterRsrc --keepParent "Arsenal Launcher.app" ../Arsenal.zip
          xcrun notarytool submit ../Arsenal.zip \
            --wait --progress \
            --apple-id '${{ inputs.apple-notarize-apple-id }}' \
            --team-id '${{ inputs.apple-notarize-team-id }}' \
            --password '${{ inputs.apple-notarize-password }}'

          xcrun stapler staple "Arsenal Launcher.app"
        else
          echo ":warning: Skipping notarization as credentials are not present." >> $GITHUB_STEP_SUMMARY
        fi
        ditto -c -k --sequesterRsrc --keepParent "Arsenal Launcher.app" ../Arsenal.zip

    - name: Create DMG
      shell: bash
      env:
        INSTALL_DIR: install
      run: |
        cd ${{ env.INSTALL_DIR }}

        mkdir -p src
        cp -R "Arsenal Launcher.app" src/

        ln -s /Applications src/

        hdiutil create \
            -volname "Arsenal Launcher ${{ inputs.version }}" \
            -srcfolder src \
            -ov -format ULMO \
            "../Arsenal.dmg"

    - name: Make Sparkle signature and appcast
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        SPARKLE_KEY: ${{ inputs.sparkle-ed25519-key }}
      run: |
        SPARKLE_BIN="${{ github.workspace }}/build/frameworks/Sparkle/bin"
        if [ ! -x "$SPARKLE_BIN/sign_update" ]; then
          echo ":warning: Sparkle tools not found at $SPARKLE_BIN" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ -z "$SPARKLE_KEY" ]; then
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
        ### Artifact Information :information_source:
        - :warning: Sparkle Signature (ed25519): No private key available (likely a pull request or fork)
        EOF
          exit 0
        fi

        printf '%s' "$SPARKLE_KEY" > ed25519-priv.pem
        # Sparkle exports a base64 seed — use sign_update, not OpenSSL PEM APIs.
        signature_zip=$("$SPARKLE_BIN/sign_update" --ed-key-file ed25519-priv.pem -p "${{ github.workspace }}/Arsenal.zip")
        signature_dmg=$("$SPARKLE_BIN/sign_update" --ed-key-file ed25519-priv.pem -p "${{ github.workspace }}/Arsenal.dmg")

        cat >> "$GITHUB_STEP_SUMMARY" << EOF
        ### Artifact Information :information_source:
        - :memo: Sparkle Signature (ed25519): \`$signature_zip\` (ZIP)
        - :memo: Sparkle Signature (ed25519): \`$signature_dmg\` (DMG)
        EOF

        if [ -n "$RELEASE_TAG" ]; then
          chmod +x "${{ github.workspace }}/scripts/macos/generate_sparkle_appcast.sh"
          "${{ github.workspace }}/scripts/macos/generate_sparkle_appcast.sh" \
            --dmg "${{ github.workspace }}/Arsenal.dmg" \
            --tag "$RELEASE_TAG" \
            --key ed25519-priv.pem \
            --sparkle-bin "$SPARKLE_BIN" \
            --out "${{ github.workspace }}/appcast.xml"
          echo "- :satellite: Generated \`appcast.xml\` for tag \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
        fi

        rm -f ed25519-priv.pem

    - name: Upload binary tarball
      uses: actions/upload-artifact@v7
      with:
        name: Arsenal-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: Arsenal.zip

    - name: Upload disk image
      uses: actions/upload-artifact@v7
      with:
        name: Arsenal-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}.dmg
        path: Arsenal.dmg

    - name: Upload Sparkle appcast
      if: ${{ inputs.release-tag != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: Arsenal-${{ inputs.artifact-name }}-appcast
        path: appcast.xml
        if-no-files-found: warn
